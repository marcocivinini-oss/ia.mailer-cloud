<title>IA International Advisors S.r.l. — IA Advisors Hub</title>

<style>
  :root {
    --navy: #131D4B;
    --blue: #0E2289;
    --logo-blue: #132389;
    --orange: #F57547;
    --paper: #FFFFFF;
    --mist: #F3F4F8;
    --ink: #1B2140;
    --muted: #5A6180;
    --line: #DADDE8;
    --display: "Poppins", "Segoe UI", Arial, sans-serif;
    --body: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--mist);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Testata ---------- */
  .top {
    background: var(--navy);
    color: #fff;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 22px 0;
  }
  .logo { display: block; height: 68px; width: auto; }
  .session { display: flex; align-items: center; gap: 18px; font-size: 15px; color: #C9CDE0; }
  .session a {
    color: #fff; text-decoration: none; font-family: var(--display); font-weight: 500;
    font-size: 14px; border: 1px solid rgba(255,255,255,.35); padding: 7px 16px;
  }
  .session a:hover { border-color: var(--orange); }
  #user:empty { display: none; }

  .hero { padding: 56px 0 72px; }
  .hero-frame {
    position: relative; display: inline-block;
    padding: 26px 40px 26px 34px;
  }
  .hero-frame::before {
    content: ""; position: absolute; inset: 0;
    border: 4px solid var(--orange); border-right: none;
    width: 70%;
  }
  .hero h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(34px, 6vw, 58px); line-height: 1.08; letter-spacing: -0.5px;
  }
  .hero p { margin-top: 12px; font-size: 19px; color: #C9CDE0; max-width: 34em; }

  /* ---------- Sezioni ---------- */
  main.wrap { padding-top: 64px; padding-bottom: 48px; }
  section + section { margin-top: 64px; }
  h2 {
    font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--navy);
    padding-bottom: 12px; border-bottom: 2px solid var(--navy); margin-bottom: 28px;
  }

  /* App */
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .app {
    position: relative; background: var(--paper);
    padding: 30px 30px 28px 34px;
    display: flex; flex-direction: column; min-height: 250px;
  }
  .app::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 22px;
    border: 3px solid var(--orange); border-right: none;
  }
  .app h3 { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--navy); }
  .app p { margin-top: 10px; color: var(--muted); flex: 1; }
  .app .who { margin-top: 18px; font-size: 14px; color: var(--muted); }
  .app .who strong { color: var(--ink); font-weight: 600; }
  .btn {
    display: inline-block; margin-top: 20px; align-self: flex-start;
    background: var(--blue); color: #fff; text-decoration: none;
    font-family: var(--display); font-weight: 500; font-size: 15px;
    padding: 11px 22px;
  }
  .btn:hover { background: var(--navy); }
  .btn[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }

  /* Documenti */
  .docs { background: var(--paper); }
  .doc {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 20px;
    padding: 18px 26px; border-bottom: 1px solid var(--line);
  }
  .doc:last-child { border-bottom: none; }
  .doc-name { font-weight: 600; }
  .doc-desc { font-size: 15px; color: var(--muted); }
  .doc-fmt { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--blue); }
  .doc a {
    font-family: var(--display); font-size: 14px; font-weight: 500; text-decoration: none;
    color: var(--blue); border: 1px solid var(--blue); padding: 7px 16px;
  }
  .doc a:hover { background: var(--blue); color: #fff; }
  .empty { padding: 30px 26px; color: var(--muted); }

  /* Categorie */
  .cat + .cat { margin-top: 36px; }
  .cat h3 {
    font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--navy);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .cat h3::before { content: ""; width: 14px; height: 14px; border: 3px solid var(--orange); border-right: none; }
  .cat h3 span { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .doc-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .doc-actions { display: flex; gap: 8px; }
  .doc button.del {
    font-family: var(--display); font-size: 14px; font-weight: 500; cursor: pointer;
    background: none; color: #B3261E; border: 1px solid #E3B4B0; padding: 7px 14px;
  }
  .doc button.del:hover { background: #B3261E; color: #fff; border-color: #B3261E; }

  /* Pannello di caricamento (solo amministratore) */
  .upload { background: var(--paper); border-left: 4px solid var(--orange); padding: 26px 28px; margin-bottom: 36px; }
  .upload h3 { font-family: var(--display); font-weight: 600; font-size: 19px; color: var(--navy); margin-bottom: 16px; }
  .upload .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .upload label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .upload input[type=text], .upload select, .upload input[type=file] {
    width: 100%; font: inherit; font-size: 16px; padding: 9px 12px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 0;
  }
  .upload .full { grid-column: 1 / -1; }
  .upload button {
    margin-top: 18px; background: var(--blue); color: #fff; border: none; cursor: pointer;
    font-family: var(--display); font-weight: 500; font-size: 15px; padding: 11px 24px;
  }
  .upload button:hover { background: var(--navy); }
  .upload button:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .status { margin-top: 12px; font-size: 15px; min-height: 1.4em; }
  .status.ok { color: #1E7B3C; }
  .status.err { color: #B3261E; }

  .back { font-family: var(--display); font-weight: 500; font-size: 15px; color: var(--blue); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  footer.wrap { padding-top: 32px; padding-bottom: 56px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  footer a { color: var(--blue); }

  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    .bar { flex-wrap: wrap; }
    .hero { padding: 36px 0 52px; }
    .hero-frame { padding: 20px 24px 20px 26px; }
    .doc { grid-template-columns: 1fr auto; }
    .upload .grid { grid-template-columns: 1fr; }
    .doc-fmt { display: none; }
  }
@media (max-width:600px){
  .bar{flex-wrap:nowrap}
  .logo{height:46px}
  #user{display:none}
  .session a{white-space:nowrap;padding:9px 16px}
  .hero{padding:28px 0 40px}
  .hero-frame{padding:18px 20px 18px 22px}
  .app{padding:24px 22px 22px 28px;min-height:0}
  .btn{padding:12px 20px}
}
</style>
</head>
